<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IMS566 Task Manager Login">
    <title>Task Manager - Login</title>

    <link rel="stylesheet" href="css/login.css">

    <!-- Google Fonts Inter & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
    </style>
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Header Branding -->
            <div class="logo-container">
                <div class="login-circle">TM</div>
                <h2>Task Manager</h2>
                <p>Sign in to your dashboard</p>

                <div class="demo-login">
                    <p><strong>Demo Account</strong></p>
                    <p>Username: <strong>admin</strong></p>
                    <p>Password: <strong>12345</strong></p>
                </div>
            </div>

            <!-- Error Message Alert -->
            <div id="errorMsg" class="alert-error d-none" role="alert">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Invalid username or password!</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-container">
                        <input type="text" id="username" required placeholder="Enter username">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <input type="password" id="password" required placeholder="Enter password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <div class="footer-text">
                <span>Don't have an account? </span>
                <a href="#">Register</a>
            </div>

        </div>
    </div>

    <script>
        // Handle login form submission and authentication
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault(); // Stop page reload

            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const errorAlert = document.getElementById("errorMsg");

            // HARDCODED AUTHENTICATION CHECK
            if (user === "admin" && pass === "12345") {
                // Success: Go to dashboard
                window.location.href = "home.html";
            } else {
                // Fail: Show error message with entry shake animation resets
                errorAlert.classList.remove("d-none");
                errorAlert.style.animation = 'none';
                errorAlert.offsetHeight; /* trigger reflow */
                errorAlert.style.animation = null;
            }
        });
    </script>
</body>

</html>
